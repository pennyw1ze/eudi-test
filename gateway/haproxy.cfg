# Unified gateway for the EUDI testbed.
#
# Derived from the haproxy.conf shipped in eudi-srv-pid-issuer/docker-compose,
# extended with routes for the verifier endpoint and the verifier UI so that
# issuer, authorisation server, status list and verifier all share one origin
# (https://localhost). Sharing an origin is what lets the software wallet treat
# every URL it discovers in metadata as directly reachable.
#
# `init-addr last,libc,none` on every backend lets the gateway start even when a
# compose profile is disabled and the target hostname does not resolve yet. That
# alone is not enough: without a `resolvers` section haproxy resolves each server
# name once, at startup, and caches the result forever. The gateway always starts
# before pid-issuer (which waits on keycloak's healthcheck, ~60s), so that name is
# unresolvable at boot, `init-addr` falls through to `none`, and the backend stays
# addressless for the life of the process - every /pid-issuer request answers 503.
# Pointing the servers at docker's embedded DNS makes haproxy re-resolve in the
# background, so backends come up on their own as their containers appear.

global
    maxconn 50000
    log stdout format raw local0
    user root
    group root
    nbthread 4
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    timeout connect 10s
    timeout client 60s
    timeout server 60s
    log global
    mode http
    option httplog
    maxconn 3000
    default_backend no-match

# Docker's embedded DNS. Backend names are re-resolved in the background, so a
# container that starts (or is recreated with a new IP) after the gateway is
# picked up without a gateway restart.
resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry  1s
    hold valid   10s
    hold nx       5s
    hold timeout  5s
    hold refused  5s
    hold other    5s

frontend all
    bind 0.0.0.0:80
    bind 0.0.0.0:443 ssl crt /etc/ssl/certs/localhost.tls.pem

    # ---- authorisation server (keycloak) ----
    use_backend keycloak-backend if { path_beg /idp }
    use_backend keycloak-backend if { path_beg /.well-known/oauth-authorization-server/idp/realms/pid-issuer-realm }
    use_backend keycloak-backend if { path_beg /.well-known/openid-configuration/idp/realms/pid-issuer-realm }

    # ---- credential issuer (OpenID4VCI) ----
    use_backend pid-issuer-backend if { path_beg /.well-known/openid-credential-issuer/pid-issuer }
    use_backend pid-issuer-backend if { path_beg /.well-known/oauth-protected-resource/pid-issuer }
    use_backend pid-issuer-backend if { path_beg /.well-known/jwt-vc-issuer/pid-issuer }
    use_backend pid-issuer-metadata if { path /.well-known/jwt-issuer/pid-issuer }
    use_backend pid-issuer-backend if { path_beg /pid-issuer }

    # ---- token status list (revocation) ----
    use_backend status-list-backend if { path_beg /token_status_list }

    # ---- verifier endpoint (OpenID4VP), mounted under /verifier ----
    use_backend verifier-backend if { path_beg /verifier }

    # ---- verifier web UI gets whatever is left ----
    default_backend verifier-ui

backend keycloak-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    option forwarded proto host by by_port for
    http-request set-path /idp/realms/pid-issuer-realm/.well-known/oauth-authorization-server if { path_beg /.well-known/oauth-authorization-server/idp/realms/pid-issuer-realm }
    http-request set-path /idp/realms/pid-issuer-realm/.well-known/openid-configuration if { path_beg /.well-known/openid-configuration/idp/realms/pid-issuer-realm }
    server server1 keycloak:8080 cookie server1 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

backend pid-issuer-metadata
    http-request return status 200 content-type application/json lf-string "{\"issuer\":\"https://localhost/pid-issuer\",\"jwks_uri\":\"https://localhost/pid-issuer/public_keys.jwks\"}"

backend pid-issuer-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    option forwarded proto host by by_port for
    http-request set-path /pid-issuer/.well-known/openid-credential-issuer if { path_beg /.well-known/openid-credential-issuer/pid-issuer }
    http-request set-path /pid-issuer/.well-known/oauth-protected-resource if { path_beg /.well-known/oauth-protected-resource/pid-issuer }
    http-request set-path /pid-issuer/.well-known/jwt-vc-issuer if { path_beg /.well-known/jwt-vc-issuer/pid-issuer }
    server server1 pid-issuer:8080 cookie server1 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

backend status-list-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    option forwarded proto host by by_port for
    server server1 status-list:5000 cookie server1 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

backend verifier-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    option forwarded proto host by by_port for
    server server1 verifier-backend:8080 cookie server1 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

backend verifier-ui
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    server server1 verifier-ui:4300 cookie server1 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

backend no-match
    http-request deny deny_status 404
